# --- Audio Hardware & DSP Settings ---
audio:
  sample_rate: 16000          # 16 kHz mono capture required for ASR/TTS models
  chunk_size: 512             # Audio buffer chunk size for streaming
  channels: 1                 # Mono recording
  bandpass_low: 80            # Lower cutoff frequency (Hz)
  bandpass_high: 7500         # Upper cutoff frequency (Hz)
  vad_aggressiveness: 3       # WebRTC VAD aggressiveness level (0-3)

# --- Automatic Speech Recognition (ASR) ---
asr:
  model_size: "base.en"       # Whisper model variant (tiny, base, small, medium)
  device: "cuda"              # Target hardware: "cuda" or "cpu"
  compute_type: "float16"     # Quantization type: "float16", "int8", or "float32"
  beam_size: 5                # Beam search width for decoding

# --- Speaker Encoder ---
encoder:
  model_name: "spkrec-ecapa-voxceleb"
  embedding_dim: 192          # Expected dimensionality of speaker vectors
  device: "cuda"

# --- Text-to-Speech (TTS) & Vocoder ---
tts:
  model_name: "vits"          # Model architecture: "vits" or "yourtts"
  vocoder: "hifigan"          # Neural vocoder for raw waveform reconstruction
  device: "cuda"
  sampling_rate: 22050        # Output TTS sampling rate

# --- System & Latency Targets ---
system:
  target_latency_ms: 300      # Maximum allowable end-to-end processing delay
  log_level: "INFO"